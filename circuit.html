<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Circuit 3D — test minimal</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info { position: absolute; top: 10px; left: 10px; color: #fff; font: 16px monospace;
    text-shadow: 1px 1px 0 #000; z-index: 9; }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
<script>
  window.addEventListener('error', e => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:40%;left:0;right:0;text-align:center;color:#ff5555;font:20px monospace;z-index:99;background:rgba(0,0,0,.8);padding:10px';
    d.textContent = 'Erreur : ' + e.message;
    document.body.appendChild(d);
  });
</script>
</head>
<body>
<div id="info">Test : circuit 3D seul</div>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 120, 120);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3a7d2c, 1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(80, 140, 60);
scene.add(sun);

// Sol
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Circuit
const trackPoints = [
  [0, -90], [70, -95], [130, -70], [150, -20], [130, 30], [150, 80],
  [110, 120], [40, 105], [10, 130], [-50, 125], [-100, 95], [-130, 60],
  [-110, 10], [-140, -40], [-90, -70]
].map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', 0.6);
const SAMPLES = 600, ROAD_HALF = 9;
const samples = [];
for (let i = 0; i < SAMPLES; i++) samples.push(curve.getPointAt(i / SAMPLES));

const verts = [], idx = [];
for (let i = 0; i <= SAMPLES; i++) {
  const p = samples[i % SAMPLES];
  const t = curve.getTangentAt((i % SAMPLES) / SAMPLES);
  const side = new THREE.Vector3(-t.z, 0, t.x).normalize();
  const a = p.clone().addScaledVector(side, -ROAD_HALF);
  const b = p.clone().addScaledVector(side, ROAD_HALF);
  verts.push(a.x, 0, a.z, b.x, 0, b.z);
}
for (let i = 0; i < SAMPLES; i++) {
  const k = i * 2;
  idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
}
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
g.setIndex(idx);
g.computeVertexNormals();
const road = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x4a4a52 }));
scene.add(road);

// Un cube rouge au centre pour vérifier que la 3D tourne
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(10, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
cube.position.y = 5;
scene.add(cube);

let angle = 0;
function animate() {
  requestAnimationFrame(animate);
  angle += 0.003;
  camera.position.set(Math.sin(angle) * 160, 110, Math.cos(angle) * 160);
  camera.lookAt(0, 0, 0);
  cube.rotation.y += 0.02;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
